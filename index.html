<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ジュエリー実物大シミュレーター</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f5f5f7; color: #333; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    header { background: #fff; padding: 12px 16px; border-bottom: 1px solid #e5e5ea; text-align: center; }
    header h1 { font-size: 16px; font-weight: 600; color: #1c1c1e; }

    #stage-container { flex: 1; position: relative; background: #ffffff; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    #stage { width: 100%; height: 100%; }

    #controls { background: #fff; border-top: 1px solid #e5e5ea; display: flex; flex-direction: column; max-height: 45vh; }
    
    .tabs { display: flex; border-bottom: 1px solid #e5e5ea; background: #fafafa; }
    .tab { flex: 1; padding: 10px; text-align: center; font-size: 13px; font-weight: 500; color: #8e8e93; border: none; background: none; cursor: pointer; }
    .tab.active { color: #007aff; border-bottom: 2px solid #007aff; background: #fff; font-weight: 600; }

    .tab-content { padding: 16px; overflow-y: auto; display: none; }
    .tab-content.active { display: block; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: #666; margin-bottom: 4px; }
    .form-row { display: flex; gap: 8px; align-items: center; }
    input[type="number"], select { flex: 1; padding: 8px 10px; border: 1px solid #c7c7cc; border-radius: 8px; font-size: 14px; background: #fff; }
    input[type="range"] { flex: 1; margin: 0 8px; }

    .btn-group { display: flex; gap: 8px; margin-bottom: 12px; }
    .btn { flex: 1; padding: 8px; border: 1px solid #007aff; color: #007aff; background: #fff; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; text-align: center; }
    .btn.active { background: #007aff; color: #fff; }
    .btn-step { width: 36px; height: 36px; padding: 0; font-size: 18px; font-weight: bold; border-radius: 50%; border: 1px solid #c7c7cc; background: #f2f2f7; color: #007aff; cursor: pointer; }

    .color-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 4px; }
    .color-btn { height: 32px; border-radius: 6px; border: 2px solid transparent; cursor: pointer; }
    .color-btn.active { border-color: #1c1c1e; transform: scale(1.05); }

    .calib-box { background: #f9f9fb; border: 1px solid #e5e5ea; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .calib-mode-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .calib-mode-btn { flex: 1; padding: 6px; font-size: 12px; border: 1px solid #c7c7cc; border-radius: 6px; background: #fff; cursor: pointer; }
    .calib-mode-btn.active { background: #e5f1ff; border-color: #007aff; color: #007aff; font-weight: 600; }

    #calib-guide-container { margin: 10px 0; padding: 8px; background: #fff; border: 1px dashed #007aff; border-radius: 6px; }
    .calib-line-card { position: relative; height: 30px; background: #e5f1ff; border-left: 3px solid #ff3b30; border-right: 3px solid #007aff; border-radius: 2px; }
    .calib-line-ruler { position: relative; height: 16px; background: #34c759; border-radius: 2px; }
  </style>
</head>
<body>

<header>
  <h1>ジュエリー実物大シミュレーター</h1>
</header>

<div id="stage-container">
  <svg id="stage"></svg>
</div>

<div id="controls">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('gem')">宝石設定</button>
    <button class="tab" onclick="switchTab('ring')">リング設定</button>
    <button class="tab" onclick="switchTab('calib')">実物大調整</button>
  </div>

  <!-- 宝石設定 -->
  <div id="tab-gem" class="tab-content active">
    <div class="btn-group">
      <button id="view-front-btn" class="btn active" onclick="setView('front')">正面表示</button>
      <button id="view-side-btn" class="btn" onclick="setView('side')">側面表示</button>
    </div>
    
    <div class="form-group">
      <label>形状</label>
      <select id="gem-shape" onchange="updateDrawing()">
        <option value="round">ラウンド (Round)</option>
        <option value="oval">オーバル (Oval)</option>
        <option value="square">スクエア (Square/Princess)</option>
        <option value="heart">ハート (Heart)</option>
        <option value="marquise" selected>マーキス (Marquise)</option>
        <option value="pear">ペアシェイプ (Pear)</option>
        <option value="trilliant">トリリアント (Trilliant)</option>
      </select>
    </div>

    <div class="form-group">
      <label>サイズ (mm)</label>
      <div class="form-row">
        <input type="number" id="gem-length" value="8.0" step="0.1" placeholder="縦幅" oninput="updateDrawing()">
        <span>×</span>
        <input type="number" id="gem-width" value="4.0" step="0.1" placeholder="横幅" oninput="updateDrawing()">
        <span>×</span>
        <input type="number" id="gem-height" value="3.0" step="0.1" placeholder="高さ" oninput="updateDrawing()">
      </div>
    </div>

    <div class="form-group">
      <label>回転角度: <span id="angle-val">0</span>°</label>
      <div class="form-row">
        <input type="range" id="gem-angle" min="0" max="360" value="0" oninput="onAngleChange(this.value)">
        <button class="btn" style="flex:0 0 50px; padding:4px;" onclick="resetAngle()">リセット</button>
      </div>
    </div>

    <div class="form-group">
      <label>カラー（宝石イメージ）</label>
      <select id="gem-color-select" style="display:none;" onchange="updateDrawing()"></select>
      <div class="color-grid" id="color-palette"></div>
    </div>
  </div>

  <!-- リング設定 -->
  <div id="tab-ring" class="tab-content">
    <div class="form-group">
      <label>リング枠の表示</label>
      <select id="ring-enable" onchange="updateDrawing()">
        <option value="false">非表示 (ルースのみ)</option>
        <option value="true" selected>表示する</option>
      </select>
    </div>

    <div class="form-group">
      <label>リングサイズ (号数)</label>
      <input type="number" id="ring-size" value="11" step="0.5" oninput="updateDrawing()">
    </div>

    <div class="form-group">
      <label>アーム幅 / 厚み (mm)</label>
      <div class="form-row">
        <input type="number" id="ring-width" value="2.0" step="0.1" placeholder="幅" oninput="updateDrawing()">
        <span>/</span>
        <input type="number" id="ring-thick" value="1.5" step="0.1" placeholder="厚み" oninput="updateDrawing()">
      </div>
    </div>

    <div class="form-group">
      <label>素材（地金カラー）</label>
      <select id="ring-material" onchange="updateDrawing()">
        <option value="platinum">プラチナ / シルバー (銀色)</option>
        <option value="gold">イエローゴールド (金色)</option>
      </select>
    </div>
  </div>

  <!-- 実物大調整（キャリブレーション） -->
  <div id="tab-calib" class="tab-content">
    <div class="calib-box">
      <label>調整基準の選択</label>
      <div class="calib-mode-tabs">
        <button id="mode-card-btn" class="calib-mode-btn active" onclick="setCalibMode('card')">💳 カード（片側合わせ）</button>
        <button id="mode-ruler-btn" class="calib-mode-btn" onclick="setCalibMode('ruler')">📏 定規（5cm）</button>
      </div>

      <div id="calib-guide-container">
        <div id="guide-card">
          <p style="font-size:11px; color:#555; margin-bottom:6px;">カードの<b>左端を赤い線</b>に当て、<b>右端が青い線</b>に重なるよう右下のボタンで微調整してください。</p>
          <div id="card-box" class="calib-line-card"></div>
        </div>
        <div id="guide-ruler" style="display:none;">
          <p style="font-size:11px; color:#555; margin-bottom:6px;">実際の定規の <b>50mm (5cm)</b> と長さを合わせてください。</p>
          <div id="ruler-box" class="calib-line-ruler"></div>
        </div>
      </div>

      <div class="form-group" style="margin-top:10px;">
        <label>補正値微調整 (px/mm)</label>
        <div class="form-row">
          <button class="btn-step" onclick="stepCalib(-0.02)">－</button>
          <input type="range" id="calib-slider" min="2.0" max="6.0" step="0.01" value="3.78" oninput="onCalibChange(this.value)">
          <button class="btn-step" onclick="stepCalib(0.02)">＋</button>
        </div>
      </div>

      <button class="btn active" style="width:100%; margin-top:8px;" onclick="saveCalibration()">この補正値を保存</button>
    </div>

    <div class="form-group">
      <label>拡大 / 縮小表示: <span id="zoom-val">100</span>%</label>
      <div class="form-row">
        <input type="range" id="zoom-slider" min="50" max="200" value="100" oninput="onZoomChange(this.value)">
        <button class="btn" style="flex:0 0 50px; padding:4px;" onclick="resetZoom()">100%</button>
      </div>
    </div>
  </div>
</div>

<script>
  let pxPerMm = parseFloat(localStorage.getItem('gem_px_per_mm')) || 3.78;
  let currentZoom = 1.0;
  let currentView = 'front';
  let selectedColorKey = 'paraiba';
  let currentAngle = 0;
  let calibMode = 'card';

  const colorMap = {
    ruby:       { fill: '#d90429', stroke: '#800f2f', name: 'ルビー (赤)' },
    paraiba:    { fill: '#4ea8de', stroke: '#0077b6', name: 'パライバトルマリン (水色)' },
    emerald:    { fill: '#2d6a4f', stroke: '#1b4332', name: 'エメラルド (緑)' },
    sphene:     { fill: '#d4a373', stroke: '#bc6c25', name: 'スフェーン (黄)' },
    sapphire:   { fill: '#1d3557', stroke: '#0b090a', name: 'ロイヤルブルーサファイア (青)' },
    padparadscha:{ fill: '#f28482', stroke: '#c9184a', name: 'パパラチアサファイア (ピンク)' },
    mint:       { fill: '#95d5b2', stroke: '#40916c', name: 'ミントガーネット (黄緑)' },
    amethyst:   { fill: '#7209b7', stroke: '#3a0ca3', name: 'アメジスト (紫)' },
    mari:       { fill: '#e07a5f', stroke: '#9d4edd', name: 'マリガーネット (オレンジ)' },
    white:      { fill: '#f8f9fa', stroke: '#adb5bd', name: 'クリア/ダイヤ (白)' }
  };

  function getRingInnerDiameter(size) {
    return 13.0 + (size - 1) * (1 / 3);
  }

  window.onload = () => {
    buildColorPalette();
    document.getElementById('calib-slider').value = pxPerMm;
    updateCalibGuides();
    updateDrawing();
  };

  function buildColorPalette() {
    const palette = document.getElementById('color-palette');
    palette.innerHTML = '';
    const select = document.getElementById('gem-color-select');
    select.innerHTML = '';

    Object.keys(colorMap).forEach(key => {
      const opt = document.createElement('option');
      opt.value = key; opt.innerText = colorMap[key].name;
      select.appendChild(opt);

      const btn = document.createElement('button');
      btn.className = `color-btn ${key === selectedColorKey ? 'active' : ''}`;
      btn.style.backgroundColor = colorMap[key].fill;
      btn.title = colorMap[key].name;
      btn.onclick = () => selectColor(key);
      palette.appendChild(btn);
    });
  }

  function switchTab(tabName) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    
    event.target.classList.add('active');
    document.getElementById('tab-' + tabName).classList.add('active');
  }

  function setView(view) {
    currentView = view;
    document.getElementById('view-front-btn').classList.toggle('active', view === 'front');
    document.getElementById('view-side-btn').classList.toggle('active', view === 'side');
    updateDrawing();
  }

  function selectColor(colorKey) {
    selectedColorKey = colorKey;
    document.getElementById('gem-color-select').value = colorKey;
    buildColorPalette();
    updateDrawing();
  }

  function onAngleChange(val) {
    currentAngle = parseFloat(val);
    document.getElementById('angle-val').innerText = val;
    updateDrawing();
  }
  function resetAngle() {
    document.getElementById('gem-angle').value = 0;
    onAngleChange(0);
  }

  function onZoomChange(val) {
    currentZoom = val / 100;
    document.getElementById('zoom-val').innerText = val;
    updateDrawing();
  }
  function resetZoom() {
    document.getElementById('zoom-slider').value = 100;
    onZoomChange(100);
  }

  function setCalibMode(mode) {
    calibMode = mode;
    document.getElementById('mode-card-btn').classList.toggle('active', mode === 'card');
    document.getElementById('mode-ruler-btn').classList.toggle('active', mode === 'ruler');
    document.getElementById('guide-card').style.display = mode === 'card' ? 'block' : 'none';
    document.getElementById('guide-ruler').style.display = mode === 'ruler' ? 'block' : 'none';
    updateCalibGuides();
  }

  function onCalibChange(val) {
    pxPerMm = parseFloat(val);
    updateCalibGuides();
    updateDrawing();
  }

  function stepCalib(delta) {
    pxPerMm = Math.max(2.0, Math.min(6.0, pxPerMm + delta));
    document.getElementById('calib-slider').value = pxPerMm;
    updateCalibGuides();
    updateDrawing();
  }

  function updateCalibGuides() {
    document.getElementById('card-box').style.width = (85.6 * pxPerMm) + 'px';
    document.getElementById('ruler-box').style.width = (50.0 * pxPerMm) + 'px';
  }

  function saveCalibration() {
    localStorage.setItem('gem_px_per_mm', pxPerMm);
    alert('実物大の補正値を保存しました！');
  }

  function updateDrawing() {
    const stage = document.getElementById('stage');
    stage.innerHTML = '';

    const cx = stage.clientWidth / 2;
    const cy = stage.clientHeight / 2;
    const scale = pxPerMm * currentZoom;

    const shape = document.getElementById('gem-shape').value;
    const l = parseFloat(document.getElementById('gem-length').value) || 8.0;
    const w = parseFloat(document.getElementById('gem-width').value) || 4.0;
    const h = parseFloat(document.getElementById('gem-height').value) || 3.0;

    const showRing = document.getElementById('ring-enable').value === 'true';
    const ringSize = parseFloat(document.getElementById('ring-size').value) || 11;
    const ringW = parseFloat(document.getElementById('ring-width').value) || 2.0;
    const ringThick = parseFloat(document.getElementById('ring-thick').value) || 1.5;
    const ringMat = document.getElementById('ring-material').value;

    const metalColor = ringMat === 'gold' ? '#e5b842' : '#d0d5dd';
    const gemColor = colorMap[selectedColorKey].fill;
    const gemStroke = colorMap[selectedColorKey].stroke;

    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");

    if (currentView === 'front') {
      if (showRing) {
        const innerDiameter = getRingInnerDiameter(ringSize);
        const outerDiameter = innerDiameter + (ringThick * 2);
        const outerPx = outerDiameter * scale;
        const ringWidthPx = ringW * scale;

        const ringBand = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        ringBand.setAttribute("x", cx - (outerPx / 2));
        ringBand.setAttribute("y", cy - (ringWidthPx / 2));
        ringBand.setAttribute("width", outerPx);
        ringBand.setAttribute("height", ringWidthPx);
        ringBand.setAttribute("rx", Math.min(ringWidthPx, 4));
        ringBand.setAttribute("ry", Math.min(ringWidthPx, 4));
        ringBand.setAttribute("fill", metalColor);
        g.appendChild(ringBand);
      }

      const gemGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
      gemGroup.setAttribute("transform", `rotate(${currentAngle}, ${cx}, ${cy})`);

      const pw = w * scale;
      const pl = l * scale;
      const rx = pw / 2;
      const ry = pl / 2;

      let pathData = "";

      if (shape === 'round' || shape === 'oval') {
        const gem = document.createElementNS("http://www.w3.org/2000/svg", "ellipse");
        gem.setAttribute("cx", cx); gem.setAttribute("cy", cy);
        gem.setAttribute("rx", rx); gem.setAttribute("ry", ry);
        gem.setAttribute("fill", gemColor); gem.setAttribute("fill-opacity", "0.85");
        gem.setAttribute("stroke", gemStroke); gem.setAttribute("stroke-width", "1.5");
        gemGroup.appendChild(gem);
      } else if (shape === 'square') {
        const gem = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        gem.setAttribute("x", cx - rx);
        gem.setAttribute("y", cy - ry);
        gem.setAttribute("width", pw);
        gem.setAttribute("height", pl);
        gem.setAttribute("rx", Math.min(pw, pl) * 0.05);
        gem.setAttribute("ry", Math.min(pw, pl) * 0.05);
        gem.setAttribute("fill", gemColor); gem.setAttribute("fill-opacity", "0.85");
        gem.setAttribute("stroke", gemStroke); gem.setAttribute("stroke-width", "1.5");
        gemGroup.appendChild(gem);
      } else if (shape === 'heart') {
        const topY = cy - ry;
        const bottomY = cy + ry;
        const r = rx / 2;
        const notchY = topY + r;

        pathData = `M ${cx} ${notchY}
                    A ${r} ${r} 0 0 1 ${cx + rx} ${notchY}
                    Q ${cx + rx} ${cy + ry * 0.4}, ${cx} ${bottomY}
                    Q ${cx - rx} ${cy + ry * 0.4}, ${cx - rx} ${notchY}
                    A ${r} ${r} 0 0 1 ${cx} ${notchY} Z`;
      } else if (shape === 'marquise') {
        pathData = `M ${cx} ${cy - ry}
                    Q ${cx + rx * 1.414} ${cy}, ${cx} ${cy + ry}
                    Q ${cx - rx * 1.414} ${cy}, ${cx} ${cy - ry} Z`;
      } else if (shape === 'pear') {
        pathData = `M ${cx} ${cy - ry}
                    C ${cx + rx * 1.2} ${cy + ry * 0.3}, ${cx + rx} ${cy + ry}, ${cx} ${cy + ry}
                    C ${cx - rx} ${cy + ry}, ${cx - rx * 1.2} ${cy + ry * 0.3}, ${cx} ${cy - ry} Z`;
      } else if (shape === 'trilliant') {
        pathData = `M ${cx} ${cy - ry}
                    Q ${cx + rx * 1.1} ${cy}, ${cx + rx} ${cy + ry * 0.8}
                    Q ${cx} ${cy + ry * 1.1}, ${cx - rx} ${cy + ry * 0.8}
                    Q ${cx - rx * 1.1} ${cy}, ${cx} ${cy - ry} Z`;
      }

      if (pathData) {
        const gem = document.createElementNS("http://www.w3.org/2000/svg", "path");
        gem.setAttribute("d", pathData);
        gem.setAttribute("fill", gemColor); gem.setAttribute("fill-opacity", "0.85");
        gem.setAttribute("stroke", gemStroke); gem.setAttribute("stroke-width", "1.5");
        gemGroup.appendChild(gem);
      }

      g.appendChild(gemGroup);

    } else {
      const pw = w * scale;
      const ph = h * scale;

      const crownH = ph * 0.35;
      const tableW = pw * 0.55;

      const gemTopY = cy - ph;
      const girdleY = gemTopY + crownH;
      const bottomY = gemTopY + ph;

      const sidePath = `
        M ${cx - tableW / 2} ${gemTopY}
        L ${cx + tableW / 2} ${gemTopY}
        L ${cx + pw / 2} ${girdleY}
        L ${cx} ${bottomY}
        L ${cx - pw / 2} ${girdleY}
        Z
      `;

      if (showRing) {
        const innerDiameter = getRingInnerDiameter(ringSize);
        const outerDiameter = innerDiameter + (ringThick * 2);

        const innerRadiusPx = (innerDiameter / 2) * scale;
        const outerRadiusPx = (outerDiameter / 2) * scale;

        const ringCenterY = bottomY + outerRadiusPx;

        const outerRing = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        outerRing.setAttribute("cx", cx);
        outerRing.setAttribute("cy", ringCenterY);
        outerRing.setAttribute("r", outerRadiusPx);
        outerRing.setAttribute("fill", metalColor);
        g.appendChild(outerRing);

        const innerRing = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        innerRing.setAttribute("cx", cx);
        innerRing.setAttribute("cy", ringCenterY);
        innerRing.setAttribute("r", innerRadiusPx);
        innerRing.setAttribute("fill", "#ffffff");
        g.appendChild(innerRing);
      }

      const gemSideGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
      const gemCenterY = gemTopY + (ph / 2);
      gemSideGroup.setAttribute("transform", `rotate(${currentAngle}, ${cx}, ${gemCenterY})`);

      const gemSide = document.createElementNS("http://www.w3.org/2000/svg", "path");
      gemSide.setAttribute("d", sidePath);
      gemSide.setAttribute("fill", gemColor); gemSide.setAttribute("fill-opacity", "0.85");
      gemSide.setAttribute("stroke", gemStroke); gemSide.setAttribute("stroke-width", "1.5");
      gemSideGroup.appendChild(gemSide);

      g.appendChild(gemSideGroup);
    }

    stage.appendChild(g);
  }
</script>
</body>
</html>
